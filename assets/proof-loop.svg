<svg width="1200" height="190" viewBox="0 0 1200 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The proof loop</title>
  <desc id="desc">Observe, record, replay, verify, then improve.</desc>
  <defs>
    <linearGradient id="line" x1="90" y1="95" x2="1110" y2="95" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111E"/>
      <stop offset="1" stop-color="#120B27"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="190" rx="22" fill="url(#panel)"/>
  <rect x="1" y="1" width="1198" height="188" rx="21" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <path d="M145 95H1055" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
  <path d="M1047 86L1057 95L1047 104" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(150 95)"><circle r="42" fill="#0A1E27" stroke="#2DD4BF" stroke-width="2"/><text y="6" fill="#F8FAFC" font-size="15" font-weight="700">OBSERVE</text><text y="67" fill="#6EE7D5" font-size="11" font-family="ui-monospace, monospace" letter-spacing="1">BOUNDARY</text></g>
    <g transform="translate(450 95)"><circle r="42" fill="#0A1928" stroke="#38BDF8" stroke-width="2"/><text y="6" fill="#F8FAFC" font-size="15" font-weight="700">RECORD</text><text y="67" fill="#7DD3FC" font-size="11" font-family="ui-monospace, monospace" letter-spacing="1">RECEIPT</text></g>
    <g transform="translate(750 95)"><circle r="42" fill="#10152A" stroke="#818CF8" stroke-width="2"/><text y="6" fill="#F8FAFC" font-size="15" font-weight="700">REPLAY</text><text y="67" fill="#A5B4FC" font-size="11" font-family="ui-monospace, monospace" letter-spacing="1">OUTCOME</text></g>
    <g transform="translate(1050 95)"><circle r="42" fill="#18102D" stroke="#8B5CF6" stroke-width="2"/><text y="6" fill="#F8FAFC" font-size="15" font-weight="700">VERIFY</text><text y="67" fill="#C4B5FD" font-size="11" font-family="ui-monospace, monospace" letter-spacing="1">CLAIM</text></g>
  </g>

  <g fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" text-anchor="middle" letter-spacing="1">
    <text x="300" y="80">CANONICALIZE</text><text x="600" y="80">COMMIT</text><text x="900" y="80">CHALLENGE</text>
  </g>
</svg>
