<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">rcode</title>
  <desc id="desc">A coding agent for the terminal and a command center. Use your own model, your Claude plan, or your Codex plan. Every turn ends with a receipt.</desc>
  <rect width="1200" height="560" rx="28" fill="#0c0c0e"/>
  <rect width="1200" height="8" fill="#ff8a3d"/>
  <text x="56" y="108" fill="#ff8a3d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="6">RCODE</text>
  <text x="56" y="168" fill="#eceae6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32">The coding agent you can hand to anyone.</text>
  <text x="56" y="214" fill="#8d8d93" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">Terminal. Command center. The Claude or Codex plan you already pay for.</text>
  <g>
    <rect x="48" y="268" width="352" height="196" rx="18" fill="#151518" stroke="#2a2a30"/>
    <text x="76" y="316" fill="#ff8a3d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Terminal</text>
    <text x="76" y="358" fill="#eceae6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Say what you want.</text>
    <text x="76" y="386" fill="#eceae6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Approve what matters.</text>
    <text x="76" y="414" fill="#eceae6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Undo if you change your mind.</text>
  </g>
  <g>
    <rect x="424" y="268" width="352" height="196" rx="18" fill="#151518" stroke="#2a2a30"/>
    <text x="452" y="316" fill="#ff8a3d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Command center</text>
    <text x="452" y="358" fill="#eceae6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">A page on your computer.</text>
    <text x="452" y="386" fill="#eceae6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Skins. Your phone. A live diff.</text>
    <text x="452" y="414" fill="#eceae6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Double-click the app and it opens.</text>
  </g>
  <g>
    <rect x="800" y="268" width="352" height="196" rx="18" fill="#151518" stroke="#2a2a30"/>
    <text x="828" y="316" fill="#ff8a3d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Your plan</text>
    <text x="828" y="358" fill="#eceae6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Claude. Codex. Any agent.</text>
    <text x="828" y="386" fill="#eceae6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">No new account to create.</text>
    <text x="828" y="414" fill="#eceae6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Their next version, your next turn.</text>
  </g>
  <rect x="48" y="492" width="430" height="36" rx="18" fill="#102010" stroke="#2f6f2f"/>
  <text x="68" y="516" fill="#7dcea0" font-family="ui-monospace, monospace" font-size="14">receipt  verified  |  every turn</text>
  <text x="500" y="516" fill="#8d8d93" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">MIT  |  macOS and Linux  |  open source</text>
</svg>
