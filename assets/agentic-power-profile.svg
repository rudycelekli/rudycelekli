<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="366" viewBox="0 0 1200 366" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Power: observed upstream work and separate model assumptions</title>
  <desc id="desc">Monthly counts of authored merged upstream pull requests, not monthly productivity multipliers. Current month is partial. The Agentic Power scenario and assumptions are in the accompanying methodology.</desc>
  <rect width="1200" height="366" rx="24" fill="#0B1220"/>
  <rect x="1" y="1" width="1198" height="364" rx="23" fill="none" stroke="#26364D"/>
  <g font-family="Avenir Next,Segoe UI,sans-serif">
    <text x="42" y="61" fill="#F8FAFC" font-size="27" font-weight="750">WORK ACCEPTED UPSTREAM</text>
    <text x="42" y="94" fill="#94A3B8" font-size="15">Merged PRs by month. The leverage estimate is separate from this observed history.</text>
    <text x="1158" y="124" fill="#94A3B8" font-size="12" text-anchor="end">AS OF 2026-11-03 UTC · SAME SCALE ACROSS YEARS</text>
    <text x="42" y="188" fill="#F8FAFC" font-size="20" font-weight="700">2026</text><line x1="136" y1="268" x2="1158" y2="268" stroke="#26364D"/><rect x="286.33333333333337" y="261.0" width="40" height="7.0" rx="3" fill="#2DE2C5" fill-opacity="0.85"/><text x="306.33333333333337" y="251.0" text-anchor="middle" fill="#CBD5E1" font-size="12">242</text><text x="306.33333333333337" y="292" text-anchor="middle" fill="#94A3B8" font-size="11">SEP</text><rect x="627.0" y="174.0" width="40" height="94.0" rx="3" fill="#2DE2C5" fill-opacity="0.85"/><text x="647.0" y="164.0" text-anchor="middle" fill="#CBD5E1" font-size="12">3,228</text><text x="647.0" y="292" text-anchor="middle" fill="#94A3B8" font-size="11">OCT</text><rect x="967.6666666666667" y="265.4" width="40" height="2.6" rx="3" fill="#2DE2C5" fill-opacity="0.45"/><text x="987.6666666666667" y="255.4" text-anchor="middle" fill="#CBD5E1" font-size="12">89</text><text x="987.6666666666667" y="292" text-anchor="middle" fill="#94A3B8" font-size="11">NOV*</text>
    <text x="42" y="331" fill="#94A3B8" font-size="13">* Partial month. Counts can change when older receipts are discovered. Merge counts do not measure downstream benefit.</text>
