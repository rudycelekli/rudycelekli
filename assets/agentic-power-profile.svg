      .ap-point { animation: point-pulse 3s ease-in-out infinite; }
      @keyframes draw-line { to { stroke-dashoffset: 0; } }
      @keyframes breathe-bar { 0%, 100% { opacity: .62; } 50% { opacity: 1; } }
      @keyframes point-pulse { 0%, 100% { opacity: .68; } 50% { opacity: 1; } }
