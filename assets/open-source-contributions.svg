    <g class="playback-static">
      <text x="1158" y="92" fill="#2DE2C5" font-size="10.5" text-anchor="end">CURRENT · OCT 22, 2026</text>
      <text x="42" y="118" fill="#9B7CFF" font-size="22" font-weight="760">0</text>
