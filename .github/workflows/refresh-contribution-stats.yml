name: Refresh contribution stats and Agentic Power

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out profile
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test contribution discovery and rendering
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Refresh GitHub contribution evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_GITHUB_TOKEN: ${{ secrets.AP_REPOSITORY_TOKEN }}
          AP_EXCLUDED_REPOSITORIES: ${{ secrets.AP_EXCLUDED_REPOSITORIES }}
        run: python scripts/update_contributions.py

      - name: Commit verified changes
        run: |
          if git diff --quiet; then
            echo "Contribution evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/contributions.json data/agentic-power.json data/repository-work-aggregate.json assets/open-source-contributions.svg assets/owned-public-projects.svg assets/agentic-power-profile.svg
          git commit -m "chore: refresh contribution stats"
          git push
